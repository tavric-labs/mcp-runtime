components:
  securitySchemes:
    PlatformBearer: {type: http, scheme: bearer, description: Current platform-audience human access token}
    UserAPIKey: {type: apiKey, in: header, name: X-Api-Key}
    CredentialBrokerToken: {type: http, scheme: bearer, description: Dedicated Pod-bound mcp-runtime-credential-broker audience; not a human token}
    ControlPlaneToken: {type: http, scheme: bearer, description: Shared internal token for trusted control-plane services}
    GatewayToken: {type: http, scheme: bearer, description: Pod-bound projected service-account token with mcp-runtime-gateway audience}
  schemas:
    CredentialSource:
      type: object
      additionalProperties: false
      required: [namespace, name, provider, resource]
      properties:
        namespace: {type: string}
        name: {type: string}
        provider: {type: string, enum: [kubernetes, gcp, aws, azure, vault]}
        resource: {type: string, description: Exact provider reference; never a raw credential or credential-bearing URL}
        key: {type: string, description: Kubernetes Secret data key or Vault KV v2 string field}
        version: {type: string, description: "Optional GCP version/alias, AWS version stage, Azure version or Vault numeric version"}
        user_id: {type: string, format: uuid, description: Exactly one user_id or team_id must authorize use}
        team_id: {type: string, format: uuid}
        disabled: {type: boolean}
        revision: {type: integer, minimum: 0}
    CredentialBinding:
      type: object
      additionalProperties: false
      required: [namespace, name, source, server, server_uid, tools, human_id, agent_id, team_id, header]
      properties:
        namespace: {type: string}
        name: {type: string}
        source: {type: string, description: Approved source in this same namespace}
        server: {type: string}
        server_uid: {type: string, description: Immutable current MCPServer UID}
        tools: {type: array, minItems: 1, maxItems: 64, items: {type: string}, description: "Explicit unique tool names; no wildcards"}
        human_id: {type: string, format: uuid}
        agent_id: {type: string, description: Current managed agent ID}
        team_id: {type: string, format: uuid}
        session_id: {type: string, description: Optional exact namespace/name session constraint}
        header: {type: string, pattern: '^X-[Mm][Cc][Pp]-[Cc]redential-[A-Za-z0-9-]+$', description: Reserved header delivered only to the same-Pod server}
        disabled: {type: boolean}
        revision: {type: integer, minimum: 0}
    PersistedSession:
      type: "object"
      required: ["id", "namespace", "server_namespace", "server_name", "server_uid", "binding", "created_at"]
      properties:
        id:
          type: "string"
        uid:
          type: "string"
        namespace:
          type: "string"
        server_namespace:
          type: "string"
        server_name:
          type: "string"
        server_uid:
          type: "string"
        grant_namespace:
          type: "string"
        grant_name:
          type: "string"
        authority_team_id:
          type: "string"
        revocation_cause:
          type: "string"
        created_at:
          type: "string"
          format: "date-time"
        revoked_at:
          type: "string"
          format: "date-time"
        binding:
          type: "object"
          required: ["name"]
          properties:
            name:
              type: "string"
            namespace:
              type: "string"
            human_id:
              type: "string"
            agent_id:
              type: "string"
            team_id:
              type: "string"
            consented_trust:
              type: "string"
            expires_at:
              type: "string"
            policy_version:
              type: "string"
            upstream_token_ref:
              type: "string"
            revoked:
              type: "boolean"
        labels:
          type: "object"
          additionalProperties:
            type: "string"
        annotations:
          type: "object"
          additionalProperties:
            type: "string"
    SessionPage:
      type: "object"
      required: ["sessions"]
      properties:
        sessions:
          type: "array"
          items:
            $ref: "#/components/schemas/PersistedSession"
        next_cursor:
          type: "string"
    SessionSnapshot:
      type: "object"
      required: ["epoch", "sequence", "sessions"]
      properties:
        epoch:
          type: "string"
        sequence:
          type: "integer"
        sessions:
          type: "array"
          items:
            $ref: "#/components/schemas/PersistedSession"
    SessionChange:
      type: "object"
      required: ["kind", "sequence", "operation", "id"]
      properties:
        kind:
          type: "string"
          enum: ["session"]
        sequence:
          type: "integer"
        operation:
          type: "string"
          enum: ["upsert", "delete"]
        id:
          type: "string"
        session:
          $ref: "#/components/schemas/PersistedSession"
    SessionChanges:
      type: "object"
      required: ["epoch", "sequence", "changes", "more"]
      properties:
        epoch:
          type: "string"
        sequence:
          type: "integer"
        changes:
          type: "array"
          items:
            $ref: "#/components/schemas/SessionChange"
        more:
          type: "boolean"
    UserApiKey:
      type: object
      required: [id, name, prefix, created_at, revoked]
      properties:
        id: {type: string}
        name: {type: string}
        prefix: {type: string}
        created_at: {type: string, format: date-time}
        revoked: {type: boolean}
        revoked_at: {type: string, format: date-time}
    ErrorEnvelope:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
    HealthOK:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
