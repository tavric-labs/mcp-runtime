openapi: 3.1.0
info:
  title: MCP Runtime Platform API
  version: 1.0.0
paths:
  /api/v1/credentials/{namespace}/{kind}:
    x-audience: platform
    parameters:
      - {name: namespace, in: path, required: true, schema: {type: string}}
      - {name: kind, in: path, required: true, schema: {type: string, enum: [sources, bindings]}}
    get:
      summary: List authorized metadata without credential values
      security: [{PlatformBearer: []}, {UserAPIKey: []}]
      responses:
        "200":
          description: Current namespace membership and source authorization apply. Secret values are never included.
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - {$ref: '#/components/schemas/CredentialSource'}
                    - {$ref: '#/components/schemas/CredentialBinding'}
        "401": {description: Authentication required}
        "403": {description: Namespace access denied}
        "503": {description: Authoritative store unavailable}
  /api/v1/credentials/{namespace}/{kind}/{name}:
    x-audience: platform
    parameters:
      - {name: namespace, in: path, required: true, schema: {type: string}}
      - {name: kind, in: path, required: true, schema: {type: string, enum: [sources, bindings]}}
      - {name: name, in: path, required: true, schema: {type: string}}
    get:
      summary: Get authorized source or binding metadata
      security: [{PlatformBearer: []}, {UserAPIKey: []}]
      responses:
        "200":
          description: Metadata only; never provider credentials or resolved values.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/CredentialSource'}
                  - {$ref: '#/components/schemas/CredentialBinding'}
        "401": {description: Authentication required}
        "403": {description: Namespace or source access denied}
        "404": {description: Metadata not found}
        "503": {description: Authoritative store unavailable}
    put:
      summary: Create at revision zero or update the exact current revision
      description: Only administrators register provider sources. Binding writes require current namespace ownership, source authorization, an immutable live server reference and valid human/managed-agent/team subjects. All writes and their audit event commit atomically. Unknown fields, raw values and incomplete policy are rejected.
      security: [{PlatformBearer: []}, {UserAPIKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/CredentialSource'}
                - {$ref: '#/components/schemas/CredentialBinding'}
      responses:
        "200": {description: Committed metadata with incremented revision}
        "400": {description: Invalid or unknown metadata fields}
        "401": {description: Authentication required}
        "403": {description: "Current ownership, source authority or live target denied"}
        "404": {description: Approved source not found}
        "409": {description: Revision conflict}
        "503": {description: "Store, Kubernetes or atomic audit unavailable"}
    delete:
      summary: Delete exact-revision metadata; referenced sources cannot be deleted
      security: [{PlatformBearer: []}, {UserAPIKey: []}]
      parameters:
        - {name: revision, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "204": {description: Metadata and deletion audit committed}
        "400": {description: Exact positive revision required}
        "401": {description: Authentication required}
        "403": {description: Current administrator or namespace owner required}
        "409": {description: "Revision mismatch, absent item or source still referenced"}
        "503": {description: Store or atomic audit unavailable}
  /api/v1/credential-resolutions:
    x-audience: server-gateway
    x-listener-port: 8080
    post:
      summary: Privately resolve credentials for an authenticated server gateway
      description: HTTPS only at the platform ingress. A dedicated mcp-runtime-credential-broker Pod-bound token is verified through TokenReview and live UID-checked workload ownership. Human JWTs, API keys and identity headers cannot select a workload. Current session, directory subjects, grant, server generation, explicit tool and binding/source constraints are checked before each provider read and rechecked before durable audit and release. This response belongs only to the authenticated gateway and is never a management/UI response.
      security: [{CredentialBrokerToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [session, tool, bindings]
              properties:
                session: {type: string, description: Canonical namespace/name resolved from verified adapter identity}
                tool: {type: string}
                bindings: {type: array, minItems: 1, maxItems: 16, items: {type: string}}
      responses:
        "200":
          description: Private per-call headers; no-store. Never exposed to human callers or persisted.
          content:
            application/json:
              schema:
                type: object
                required: [headers]
                properties:
                  headers: {type: object, additionalProperties: {type: string}}
        "400": {description: Invalid request}
        "403": {description: "Workload identity, current policy or binding denied"}
        "404": {description: Approved credential metadata absent}
        "503": {description: "Provider, store, Kubernetes or audit unavailable; no values returned"}
  /api/v1/user/api-keys:
    x-audience: platform
    get:
      operationId: listUserApiKeys
      summary: List the caller's API keys
      description: Non-secret metadata for the caller's keys. The raw key value is never returned after creation.
      responses:
        "200":
          description: Key metadata; an empty list is [] and never null.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: {$ref: "#/components/schemas/UserApiKey"}
        "401": {description: unauthorized, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
    post:
      operationId: createUserApiKey
      summary: Create an API key for the caller
      description: The raw key is returned once, as api_key and one_time_key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        "201":
          description: Key created.
          content:
            application/json:
              schema:
                type: object
                required: [key, api_key, one_time_key]
                properties:
                  key: {$ref: "#/components/schemas/UserApiKey"}
                  api_key: {type: string}
                  one_time_key: {type: string}
        "400": {description: invalid request body or name, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "401": {description: unauthorized, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /api/v1/user/api-keys/{id}:
    x-audience: platform
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      operationId: revokeUserApiKey
      summary: Revoke one of the caller's API keys
      description: Idempotent; a key that is already revoked returns its final metadata. DELETE is the only revoke form.
      responses:
        "200":
          description: Revoked key metadata.
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key: {$ref: "#/components/schemas/UserApiKey"}
        "401": {description: unauthorized, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "404": {description: key not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /api/v1/auth/signup:
    x-audience: platform
    post:
      operationId: signup
      summary: Create a password account and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
                role: {type: string}
      responses:
        "201": {description: "Account created; response carries access_token, token_type and expires_in", content: {application/json: {schema: {type: object}}}}
        "400": {description: "invalid request body", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "409": {description: "email already registered", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /api/v1/auth/oidc:
    x-audience: platform
    post:
      operationId: oidcLogin
      summary: Exchange an OIDC ID token for a platform token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: {type: string}
      responses:
        "200": {description: "Platform token for the verified OIDC identity", content: {application/json: {schema: {type: object}}}}
        "400": {description: "invalid request body", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "401": {description: "ID token rejected", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /api/v1/users:
    x-audience: platform
    post:
      operationId: createUser
      summary: Create a password user (administrator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
                role: {type: string}
      responses:
        "201": {description: "User created", content: {application/json: {schema: {type: object}}}}
        "400": {description: "invalid request body", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "401": {description: "unauthorized", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "403": {description: "administrator role required", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "409": {description: "email already registered", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /api/v1/admin/audit:
    x-audience: platform
    get:
      operationId: listAudit
      summary: Audit timeline (administrator)
      responses:
        "200": {description: "audit_logs: recent audit events", content: {application/json: {schema: {type: object}}}}
        "401": {description: "unauthorized", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "403": {description: "administrator role required", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /api/v1/admin/namespaces:
    x-audience: platform
    get:
      operationId: listNamespaces
      summary: Namespace inventory (administrator)
      responses:
        "200": {description: "namespaces: the platform namespace inventory", content: {application/json: {schema: {type: object}}}}
        "401": {description: "unauthorized", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "403": {description: "administrator role required", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /api/v1/registry/authz:
    x-audience: platform
    get:
      operationId: registryAuthz
      summary: Registry forward-auth decision
      description: Called by the ingress for every registry request. 204 allows, 401 asks for credentials, 403 denies.
      responses:
        "204": {description: allowed}
        "401": {description: credentials required}
        "403": {description: denied}
        "503": {description: identity store unavailable}
  /api/v1/user/activity/image-publish:
    x-audience: platform
    post:
      operationId: recordImagePublish
      summary: Record that the caller published an image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_ref]
              properties:
                image_ref: {type: string}
                source_image: {type: string}
                mode: {type: string}
      responses:
        "202": {description: "Recorded", content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, image_ref: {type: string}}}}}}
        "400": {description: "invalid request body", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "401": {description: "unauthorized", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /api/v1/user/registry-credentials:
    x-audience: platform
    get:
      operationId: listRegistryCredentials
      summary: List the caller's registry credentials
      responses:
        "200": {description: "credentials: non-secret metadata", content: {application/json: {schema: {type: object}}}}
        "401": {description: "unauthorized", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
    post:
      operationId: createRegistryCredential
      summary: Create a registry credential for the caller
      description: The password is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        "201": {description: "credential, username and one-time password", content: {application/json: {schema: {type: object}}}}
        "400": {description: "invalid request body or name", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "401": {description: "unauthorized", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /api/v1/user/registry-credentials/{id}:
    x-audience: platform
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    delete:
      operationId: revokeRegistryCredential
      summary: Revoke one of the caller's registry credentials
      responses:
        "200": {description: "Revoked credential metadata", content: {application/json: {schema: {type: object}}}}
        "401": {description: "unauthorized", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "404": {description: "credential not found", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /internal/identity/agents/{agent_id}/certificates:
    get:
      summary: Read recorded certificate issuance for an agent (internal service authentication)
      description: Runtime API must authorize agent visibility first and supply human_id for non-managers. Counts cover the last seven days and history is limited to 100 public metadata records. Unrecorded historical certificates are not inferred from sessions.
      parameters:
        - {name: agent_id, in: path, required: true, schema: {type: string, maxLength: 128}}
        - {name: human_id, in: query, schema: {type: string, maxLength: 128}, description: Exact delegated human filter; empty permits the already-authorized agent manager's scope.}
      responses:
        "200":
          description: Recorded issuance count, explicit time window and latest public certificate metadata; never keys or PEM.
          content:
            application/json:
              schema:
                type: object
                required: [recorded, since, until, recent]
                properties:
                  recorded: {type: integer, minimum: 0}
                  since: {type: string, format: date-time}
                  until: {type: string, format: date-time}
                  recent: {type: array, maxItems: 100, items: {type: object}}
        "401": {description: Internal authentication required}
        "503": {description: Recorded history unavailable}
  /internal/operations/counts:
    get:
      description: Internal bearer-authenticated complete platform directory/session totals for the runtime administrator overview.
      responses:
        "200":
          description: Counts from one database snapshot, independent of list pagination.
          content:
            application/json:
              schema:
                type: object
                required: [teams, users, agents, active_sessions]
                properties:
                  teams: {type: integer, minimum: 0}
                  users: {type: integer, minimum: 0}
                  agents: {type: integer, minimum: 0}
                  active_sessions: {type: integer, minimum: 0}
        "401": {description: Internal bearer authentication required}
        "503": {description: Directory or session data unavailable}
  /api/v1/users/{user_id}/deactivate:
    post:
      summary: Administrator permanently deactivates an account and revokes stored access
      description: Atomically tombstones the account and memberships, revokes API keys, registry credentials, refresh tokens and human MCP sessions, and saves an audit record. Identity/audit history and deployed resources remain. Repeated requests are idempotent. Self-deactivation, the last active administrator and a team's last active owner are protected. Session changes follow the existing gateway sync/stale-window contract; issued registry bearers retain their normal expiry. Any cleanup/audit failure rolls back all changes.
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Committed non-secret cleanup result; zero counters on an already-clean account.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, status, already_deactivated, revoked_api_keys, revoked_registry_credentials, revoked_refresh_tokens, revoked_sessions, removed_memberships]
                properties:
                  user_id: {type: string, format: uuid}
                  status: {type: string, const: deactivated}
                  already_deactivated: {type: boolean}
                  revoked_api_keys: {type: integer, minimum: 0}
                  revoked_registry_credentials: {type: integer, minimum: 0}
                  revoked_refresh_tokens: {type: integer, minimum: 0}
                  revoked_sessions: {type: integer, minimum: 0}
                  removed_memberships: {type: integer, minimum: 0}
        "400": {description: Invalid user ID}
        "401": {description: Authentication required}
        "403": {description: Active administrator required}
        "404": {description: User not found}
        "409": {description: Transfer ownership or administrator authority before cleanup}
        "500": {description: Cleanup was not confirmed; retry idempotently to resolve an uncertain commit outcome.}
  /api/v1/registry/token:
    get:
      summary: Exchange registry credentials for a five-minute scoped bearer
      parameters:
        - in: query
          name: service
          required: true
          schema: {type: string, enum: [mcp-runtime-registry]}
        - in: query
          name: scope
          schema: {type: array, items: {type: string}}
          style: form
          explode: true
      responses:
        "200":
          description: Scoped token; Cache-Control is no-store
          content:
            application/json:
              schema:
                type: object
                required: [token, access_token, expires_in, issued_at]
                properties:
                  token: {type: string}
                  access_token: {type: string}
                  expires_in: {type: integer, const: 300}
                  issued_at: {type: string, format: date-time}
        "400": {description: Invalid service or scope}
        "401": {description: Authentication required}
        "403": {description: Requested repository action denied}
        "503": {description: Credential store or signer unavailable}
  /api/v1/registry/pull-credentials:
    post:
      summary: Administrator creates a namespace-bound read-only node credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace]
              additionalProperties: false
              properties:
                namespace: {type: string}
                repositories: {type: array, maxItems: 128, items: {type: string}}
      responses:
        "201":
          description: Credential returned once; Cache-Control is no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  username: {type: string}
                  password: {type: string}
                  expires_at: {type: string, format: date-time}
        "400": {description: Invalid namespace or repositories}
        "401": {description: Authentication required}
        "403": {description: Administrator required}
        "503": {description: Credential store unavailable}
    delete:
      summary: Administrator revokes a node credential
      parameters:
        - in: query
          name: id
          required: true
          schema: {type: string}
      responses:
        "204": {description: Revoked; existing bearers expire within five minutes}
        "400": {description: Invalid credential ID}
        "401": {description: Authentication required}
        "403": {description: Administrator required}
        "404": {description: Credential not found}
        "503": {description: Credential store unavailable}
  /health:
    get:
      responses:
        "200":
          description: service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOK"
  /ready:
    get:
      responses:
        "200":
          description: dependencies ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOK"
        "503":
          description: dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/openapi.yaml:
    get:
      responses:
        "200":
          description: OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/auth/me:
    get:
      responses:
        "200":
          description: current principal
          content:
            application/json:
              schema:
                type: object
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: login success
          content:
            application/json:
              schema:
                type: object
        "401":
          description: invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /internal/auth/resolve:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key:
                  type: string
      responses:
        "200":
          description: resolved principal
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /internal/identity/principal:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
      responses:
        "200":
          description: principal
          content:
            application/json:
              schema:
                type: object
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /internal/identity/resolve-ids:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_ids:
                  type: array
                  items:
                    type: string
                team_ids:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: resolved labels
          content:
            application/json:
              schema:
                type: object
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /internal/audit:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, resource, status]
              properties:
                action:
                  type: string
                resource:
                  type: string
                status:
                  type: string
      responses:
        "202":
          description: accepted
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /internal/identity/teams:
    get:
      responses:
        "200":
          description: team list
          content:
            application/json:
              schema:
                type: object
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug:
                  type: string
                name:
                  type: string
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                type: object
        "401":
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /internal/identity/teams/{slug}:
    parameters:
      - {name: slug, in: path, required: true, schema: {type: string}}
    get:
      responses:
        "200": {description: team, content: {application/json: {schema: {type: object}}}}
        "401": {description: unauthorized, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "404": {description: team not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
    delete:
      responses:
        "204": {description: team deleted}
        "401": {description: unauthorized, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "404": {description: team not found, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
  /internal/identity/teams/{slug}/agents:
    parameters:
      - {name: slug, in: path, required: true, schema: {type: string}}
    get:
      parameters:
        - {name: status, in: query, required: false, schema: {type: string, enum: [active, inactive]}}
        - {name: q, in: query, required: false, schema: {type: string}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200}}
      responses:
        "200": {description: one page of team agents, content: {application/json: {schema: {type: object}}}}
        "400": {description: invalid filter or cursor, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "401": {description: unauthorized, content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
