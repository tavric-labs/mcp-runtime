<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 688" width="1920" height="1376" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>The sign-in and token handoff sequence</title>
<desc>The client authorizes at mcp-auth with a resource, the person consents, mcp-auth redirects to the connector's provider, the provider returns to the identity callback, mcp-auth issues its own code and an access token bound to the resource. The MCP server then exchanges that token at mcp-auth, authenticating with private_key_jwt, to receive the provider token and call the provider API as the person.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b1b3a"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker></defs>
<rect width="960" height="688" rx="14" fill="#faf6ec" stroke="#d9d0bb"/>
<text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0b1b3a">Sign in, then hand the provider's token to the resource server</text>
<rect x="30" y="52" width="160" height="42" rx="8" fill="#0b1b3a"/><text x="110" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#faf6ec">MCP client</text><text x="110" y="86" text-anchor="middle" font-size="10" fill="#e6ecfa">and browser</text>
<line x1="110" y1="94" x2="110" y2="664" stroke="#b9b09a" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="280" y="52" width="160" height="42" rx="8" fill="#1f6feb"/><text x="360" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#faf6ec">mcp-auth</text><text x="360" y="86" text-anchor="middle" font-size="10" fill="#e6ecfa">login method + connector</text>
<line x1="360" y1="94" x2="360" y2="664" stroke="#b9b09a" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="530" y="52" width="160" height="42" rx="8" fill="#0b1b3a"/><text x="610" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#faf6ec">Upstream provider</text><text x="610" y="86" text-anchor="middle" font-size="10" fill="#e6ecfa">and its API, via the connector</text>
<line x1="610" y1="94" x2="610" y2="664" stroke="#b9b09a" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="770" y="52" width="160" height="42" rx="8" fill="#0b1b3a"/><text x="850" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#faf6ec">MCP server</text><text x="850" y="86" text-anchor="middle" font-size="10" fill="#e6ecfa">resource client</text>
<line x1="850" y1="94" x2="850" y2="664" stroke="#b9b09a" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="116" y1="130" x2="354" y2="130" stroke="#0b1b3a" stroke-width="2" marker-end="url(#a)"/>
<text x="130" y="122" text-anchor="start" font-size="12" fill="#0b1b3a">1  GET /authorize  resource, PKCE S256</text>
<line x1="354" y1="178" x2="116" y2="178" stroke="#0b1b3a" stroke-width="2" marker-end="url(#a)"/>
<text x="130" y="170" text-anchor="start" font-size="12" fill="#0b1b3a">2  consent page, person approves</text>
<line x1="366" y1="226" x2="604" y2="226" stroke="#0b1b3a" stroke-width="2" marker-end="url(#a)"/>
<text x="380" y="218" text-anchor="start" font-size="12" fill="#0b1b3a">3  redirect to the connector's authorization_endpoint</text>
<line x1="604" y1="274" x2="366" y2="274" stroke="#0b1b3a" stroke-width="2" marker-end="url(#a)"/>
<text x="380" y="266" text-anchor="start" font-size="12" fill="#0b1b3a">4  GET &lt;issuer&gt;/identity/callback  code, state</text>
<line x1="366" y1="322" x2="604" y2="322" stroke="#1f6feb" stroke-width="2" marker-end="url(#b)"/>
<text x="380" y="314" text-anchor="start" font-size="12" fill="#0b1b3a">5  code exchange, ID token or userinfo check</text>
<line x1="354" y1="370" x2="116" y2="370" stroke="#0b1b3a" stroke-width="2" marker-end="url(#a)"/>
<text x="130" y="362" text-anchor="start" font-size="12" fill="#0b1b3a">6  redirect back with an mcp-auth code</text>
<line x1="116" y1="418" x2="354" y2="418" stroke="#0b1b3a" stroke-width="2" marker-end="url(#a)"/>
<text x="130" y="410" text-anchor="start" font-size="12" fill="#0b1b3a">7  POST /token  code + verifier, receives the access token</text>
<line x1="116" y1="466" x2="844" y2="466" stroke="#0b1b3a" stroke-width="2" marker-end="url(#a)"/>
<text x="130" y="458" text-anchor="start" font-size="12" fill="#0b1b3a">8  MCP request  Authorization: Bearer</text>
<line x1="844" y1="514" x2="366" y2="514" stroke="#1f6feb" stroke-width="2" marker-end="url(#b)"/>
<text x="380" y="506" text-anchor="start" font-size="12" fill="#0b1b3a">9  POST /token  RFC 8693, private_key_jwt</text>
<line x1="366" y1="562" x2="844" y2="562" stroke="#1f6feb" stroke-width="2" marker-end="url(#b)"/>
<text x="380" y="554" text-anchor="start" font-size="12" fill="#0b1b3a">10  the person's provider token (upstream_session)</text>
<line x1="844" y1="610" x2="616" y2="610" stroke="#1f6feb" stroke-width="2" marker-end="url(#b)"/>
<text x="630" y="602" text-anchor="start" font-size="12" fill="#0b1b3a">11  provider API call as the person</text>
<text x="24" y="680" font-size="11" fill="#3a4a6b">Steps 1 to 7: sign-in.  Steps 8 to 11: every call that needs the provider.  Blue arrows involve the connector's provider or the exchange.</text>
</svg>