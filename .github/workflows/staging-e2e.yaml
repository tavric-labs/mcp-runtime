name: Staging E2E (Disposable VM)
run-name: Read-only staging module network diagnostics

# Temporary diagnostic branch only. Do not merge this workflow replacement.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  module-network-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: staging-e2e-disposable-vm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Configure pinned VM host key
        env:
          E2E_VM_KNOWN_HOSTS: ${{ secrets.E2E_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$E2E_VM_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$E2E_VM_KNOWN_HOSTS" > "$HOME/.ssh/mcp-runtime-e2e-known-hosts"
          chmod 600 "$HOME/.ssh/mcp-runtime-e2e-known-hosts"
      - name: Verify disposable target
        env:
          E2E_VM_HOST: ${{ secrets.E2E_VM_HOST }}
          E2E_VM_USER: ${{ secrets.E2E_VM_USER }}
          SSHPASS: ${{ secrets.E2E_VM_PASSWORD }}
          E2E_VM_KNOWN_HOSTS: /home/runner/.ssh/mcp-runtime-e2e-known-hosts
        run: bash test/e2e/staging-target.sh check
      - name: Probe public module archives without changing VM state
        env:
          E2E_VM_HOST: ${{ secrets.E2E_VM_HOST }}
          E2E_VM_USER: ${{ secrets.E2E_VM_USER }}
          SSHPASS: ${{ secrets.E2E_VM_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -o UserKnownHostsFile="$HOME/.ssh/mcp-runtime-e2e-known-hosts" \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${E2E_VM_USER}@${E2E_VM_HOST}" \
            'set -eu; if [ -f /var/lib/mcp-runtime-e2e-backup/e2e.env ]; then set -a; . /var/lib/mcp-runtime-e2e-backup/e2e.env; set +a; fi; python3 -' \
            < hack/qa/staging_module_probe.py > module-network-report.json
          python3 -m json.tool module-network-report.json
      - name: Upload redacted network report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-module-network-diagnostics
          path: module-network-report.json
          if-no-files-found: error
