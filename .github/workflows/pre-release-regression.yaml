name: Pre-release Regression

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  ui-regression:
    name: UI unit and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/ui/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: services/ui/frontend
        run: npm ci
      - name: Unit and accessibility tests
        working-directory: services/ui/frontend
        run: npm test -- --maxWorkers=2
      - name: Install Chromium
        working-directory: services/ui/frontend
        run: npx playwright install --with-deps chromium
      - name: Browser workflows with API fixtures
        working-directory: services/ui/frontend
        run: npm run test:browser
      - name: Verify committed frontend assets
        working-directory: services/ui/frontend
        run: |
          npm run build
          git diff --exit-code -- ../static
          test -z "$(git ls-files --others --exclude-standard ../static)"
      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-browser-failures
          path: services/ui/frontend/test-results
          if-no-files-found: ignore

  automation:
    name: Automation Regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Script regressions and shell lint (no cluster access)
        run: |
          hack/ci/check-scripts.sh

  release-build:
    name: Release CLI cross-platform builds
    uses: ./.github/workflows/release-build.yaml

  static:
    name: Static + Generated Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install linters
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Run go fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'gofmt -s -w .'"
            gofmt -s -d .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Validate E2E scenario selectors
        run: bash test/e2e/scenarios_test.sh

      - name: Validate regression coverage index
        run: go test ./test/regression -count=1

      - name: Regenerate CRDs/manifests
        run: make -f Makefile.operator generate manifests

      - name: Check for generated drift
        run: |
          if ! git diff --quiet; then
            echo "Generated files are out of date. Run 'make -f Makefile.operator generate manifests'."
            git diff
            exit 1
          fi

  root-tests:
    name: Root, CLI + Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install envtest
        run: |
          KUBEBUILDER_ASSETS="$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.0 use -p path)"
          export KUBEBUILDER_ASSETS
          echo "KUBEBUILDER_ASSETS=$KUBEBUILDER_ASSETS" >> "$GITHUB_ENV"

      - name: Build CLI
        run: go build -o bin/mcp-runtime ./cmd/mcp-runtime

      - name: Run CLI and golden tests
        run: go test -v -race -count=1 ./cmd/mcp-runtime ./internal/cli/... ./test/golden/...

      - name: Run root unit tests
        run: |
          module_path="$(go list -m)"
          go list ./... > "$RUNNER_TEMP/root-packages.txt"
          mapfile -t packages < <(grep -v -x "${module_path}/test/integration" "$RUNNER_TEMP/root-packages.txt")
          go test -v -race -count=1 "${packages[@]}"

      - name: Run integration tests
        run: go test -v -race -timeout 30m -count=1 ./test/integration/...
        env:
          KUBEBUILDER_ASSETS: ${{ env.KUBEBUILDER_ASSETS }}

  service-tests:
    name: Platform Service Tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # One entry per services/*/go.mod, matching the CI service test loop.
        service:
          - platform-api
          - runtime-api
          - analytics-api
          - ingest
          - processor
          - mcp-gateway
          - ui
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: disposable-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MCP_PLATFORM_TEST_POSTGRES_DSN: postgres://postgres:disposable-test-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Run service tests
        run: go test -v -race -count=1 ./...
        working-directory: services/${{ matrix.service }}

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: go test -run=^$ -bench=. -benchmem -count=1 ./test/benchmark/...

  repository-sbom:
    name: Repository SBOM
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate repository SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: mcp-runtime-repository.spdx.json

      - name: Upload repository SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pre-release-repository-sbom
          path: mcp-runtime-repository.spdx.json
          if-no-files-found: error

  gosec:
    name: Gosec Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.26.1

      - name: Run gosec
        run: '"$(go env GOPATH)/bin/gosec" ./...'

  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
          cache: false

      - name: Install Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.29.1

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${GITHUB_BASE_REF}"

      - name: Scan changed commits
        env:
          GITLEAKS_EVENT_NAME: ${{ github.event_name }}
          GITLEAKS_BASE_REF: ${{ github.base_ref }}
          GITLEAKS_EVENT_BEFORE: ${{ github.event.before }}
          GITLEAKS_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITLEAKS_EVENT_NAME" == "pull_request" ]]; then
            log_opts="--first-parent --diff-merges=first-parent origin/${GITLEAKS_BASE_REF}..${GITLEAKS_SHA}"
          elif [[ "$GITLEAKS_EVENT_NAME" == "push" && "$GITLEAKS_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            log_opts="--first-parent --diff-merges=first-parent ${GITLEAKS_EVENT_BEFORE}..${GITLEAKS_SHA}"
          else
            log_opts="-1 ${GITLEAKS_SHA}"
          fi
          "$(go env GOPATH)/bin/gitleaks" git --log-opts="$log_opts" --config .gitleaks.toml --redact --verbose .

  trivy:
    name: Supply chain
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-trivy.yaml

  full-kind:
    name: Kind (${{ matrix.mode }}, ${{ matrix.replicas }})
    strategy:
      fail-fast: false
      matrix:
        mode: [org, public]
        replicas: [single, multi]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/full-qa-e2e.yaml
    with:
      platform-mode: ${{ matrix.mode }}
      replica-profile: ${{ matrix.replicas }}

  macos-companion:
    name: macOS companion
    uses: ./.github/workflows/macos-companion.yaml

  scoped-observability:
    name: Scoped observability
    uses: ./.github/workflows/scoped-observability-e2e.yaml

  protocol-transports:
    name: Protocol and transport matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Adapter HTTP and gateway protocol, auth and response combinations
        run: |
          KUBECONFIG="$(mktemp)"
          export KUBECONFIG
          go test -race -count=1 -v ./internal/agentadapter -run 'TestReleaseProtocolTransportMatrix'
          cd services/mcp-gateway
          go test -race -count=1 -v . -run 'TestReleaseProtocolTransportMatrix'

  plugins:
    name: Plugin Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: |
          KUBECONFIG="$(mktemp)"
          export KUBECONFIG
          for plugin in traefik-plugins/*/; do
            (cd "$plugin" && go test -race -count=1 ./...)
          done

  staging-e2e:
    name: Staging (${{ matrix.mode }}, ${{ matrix.auth }})
    needs: [static, root-tests, service-tests]
    strategy:
      fail-fast: false
      # One disposable VM; never enqueue competing matrix jobs on its lock.
      max-parallel: 1
      matrix:
        mode: [org, public]
        auth: [disabled, enabled]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/staging-e2e.yaml
    with:
      platform-mode: ${{ matrix.mode }}
      mcp-auth-mode: ${{ matrix.auth }}
      run-multitenancy: true
    secrets: inherit

  native-registry-acceptance:
    name: Native registry authorization acceptance
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-registry-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test a disposable Distribution backend
        working-directory: services/platform-api
        env:
          MCP_REGISTRY_NATIVE_E2E: "1"
        run: go test ./registry -run TestDistributionEnforcesNativeRegistryScopes -count=1 -timeout=5m
      - name: Test stored node scopes, expiry and revocation
        working-directory: services/platform-api
        env:
          MCP_PLATFORM_TEST_POSTGRES_DSN: postgres://postgres:disposable-registry-test@127.0.0.1:5432/postgres?sslmode=disable
        run: go test ./test/integration -run TestRegistryPullCredentialsRevocationAndExpiry -count=1 -timeout=2m

  release-gate:
    name: Release gate
    if: ${{ always() }}
    needs: [release-build, static, root-tests, service-tests, benchmarks, repository-sbom, gosec, gitleaks, trivy, automation, ui-regression, native-registry-acceptance, full-kind, macos-companion, scoped-observability, protocol-transports, plugins, staging-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every release check, including every matrix cell
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: item['result'] for name, item in results.items() if item['result'] != 'success'}
          if failed:
              raise SystemExit(f'Release blocked: {failed}')
          print('All release combinations passed for this source commit.')
          PY
