name: Release

# The manual path verifies the immutable candidate before creating its tag or
# release. The release event remains supported, with assets blocked by the same
# gate if someone publishes a release outside this workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag, for example v0.15.0
        required: true
        type: string
      ref:
        description: Candidate ref already merged to main and tested by Pre-release Regression
        default: main
        type: string
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Verify release authorization
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
          fetch-depth: 0
      - name: Validate source, version and release notes
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$commit"
          fi
          grep -Fq "## [${RELEASE_TAG#v}] - " CHANGELOG.md
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Require full regression evidence for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: python3 hack/release/verify_gate.py --repository "$GITHUB_REPOSITORY" --commit "$RELEASE_COMMIT"

  build:
    name: Build CLI binaries
    needs: gate
    uses: ./.github/workflows/release-build.yaml
    with:
      ref: ${{ needs.gate.outputs.commit }}
      version: ${{ needs.gate.outputs.tag }}
    permissions:
      contents: read

  macos-adapter:
    name: Build universal macOS Adapter preview
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build desktop app and universal CLI with release metadata
        env:
          MCP_RELEASE_VERSION: ${{ needs.gate.outputs.tag }}
          MCP_RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
        run: bash hack/release/macos-adapter/package.sh "${RUNNER_TEMP}/macos-adapter-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-adapter-release-assets
          path: ${{ runner.temp }}/macos-adapter-dist/*
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Upload release assets
    runs-on: ubuntu-24.04
    needs: [gate, build, macos-adapter]
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0
          path: src

      - name: Add CLI installers
        run: cp src/install.sh src/install.ps1 dist/

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/go.mod
          cache: false

      # platform-manifest.json is the authoritative component version list that
      # `mcp-runtime update --to <tag>` fetches. When config/crd/bases changed
      # since the previous tag, crdChange is set and CRD YAML is embedded so
      # update can apply schema changes before image rollouts.
      - name: Generate platform component manifest
        shell: bash
        working-directory: src
        env:
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          set -euo pipefail
          export RELEASE_COMMIT
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          crd_flag=""
          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_COMMIT}^" 2>/dev/null || true)"
          if [[ -z "${previous_tag}" ]] || ! git diff --quiet "${previous_tag}" "${RELEASE_COMMIT}" -- config/crd/bases; then
            crd_flag="-crd-change"
          fi
          go run ./hack/release/platformmanifest \
            -version "${RELEASE_TAG}" \
            -commit "${RELEASE_COMMIT}" \
            ${crd_flag} \
            -write-crds ../dist/platform-crds.yaml \
            > ../dist/platform-manifest.json
          python3 - <<'PY'
          import json, os
          m=json.load(open("../dist/platform-manifest.json"))
          expected=f"{os.environ['RELEASE_TAG']}-g{os.environ['RELEASE_COMMIT']}"
          # The generator already verified the full invariants (built images tagged
          # to the commit, third-party pins, config-only components, strict decode);
          # this is a sanity check on what is about to be published.
          assert m['version'] == os.environ['RELEASE_TAG']
          assert m['components']
          built = [c for c in m['components'] if c.get('tag') == expected]
          assert built, "no component is tagged to the release commit"
          assert all(c.get('tag') or c.get('configOnly') for c in m['components']), "a component has neither a tag nor configOnly"
          print("version", m.get("version"), "crdChange", bool(m.get("crdChange")), "components", len(m.get("components",[])), "built", len(built), "crds_bytes", len(m.get("crds") or ""))
          PY

      - name: List release assets
        run: find dist -type f | sort

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            install.sh
            install.ps1
            mcp-runtime-darwin-arm64
            mcp-runtime-darwin-amd64
            mcp-runtime-darwin-universal
            MCPRuntimeAdapter-unsigned-preview.zip
            mcp-runtime-darwin-universal-unsigned-preview.zip
            mcp-runtime-linux-arm64
            mcp-runtime-linux-amd64
            mcp-runtime-windows-amd64.exe
            platform-manifest.json
            platform-crds.yaml
          )
          for asset in "${expected[@]}"; do
            if [[ ! -s "dist/${asset}" ]]; then
              echo "Missing or empty release asset: ${asset}" >&2
              exit 1
            fi
          done
          actual_count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "${actual_count}" != "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} release assets, found ${actual_count}" >&2
            find dist -maxdepth 1 -type f | sort >&2
            exit 1
          fi
          if ! python3 -c 'import json; m=json.load(open("dist/platform-manifest.json")); assert (not m.get("crdChange")) or (m.get("crds") or "").strip()'; then
            echo "platform-manifest.json with crdChange must embed non-empty crds" >&2
            exit 1
          fi

      - name: Checksum release assets
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Recheck gate before publishing
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
        run: python3 hack/release/verify_gate.py --repository "$GITHUB_REPOSITORY" --commit "$RELEASE_COMMIT"

      - name: Create release only after all assets and checks are ready
        if: github.event_name == 'workflow_dispatch'
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          section = changelog.split(f"## [{tag[1:]}] - ", 1)[1].split('\n', 1)[1].split('\n## [', 1)[0].strip()
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{tag}/"
          section = re.sub(r'\]\(((?:docs|hack)/[^)]+)\)', lambda match: '](' + base + match[1] + ')', section)
          pathlib.Path('../release-notes.md').write_text(section + '\n')
          PY
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" \
            --title "MCP Runtime $RELEASE_TAG" --notes-file ../release-notes.md \
            --fail-on-no-commits ../dist/*

      - name: Upload assets for a release published externally
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
